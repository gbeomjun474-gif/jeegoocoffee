        /* 스크롤 애니메이션 */

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .result-item.highlight .label { font-size: 18px; font-weight: 700; color: var(--accent-blue); }
        .result-item.highlight .price-save { font-size: 32px; font-weight: 700; color: var(--primary-color); flex: 1 1 auto; text-align: right; white-space: nowrap; }

        .cta-section .section-title { color: var(--pure-white); }
        .cta-section .section-subtitle { color: rgba(255,255,255,0.8); }
